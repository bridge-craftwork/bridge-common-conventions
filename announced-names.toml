# Announced convention names: what an opponent's alert or announcement
# says, mapped to the card fields that play it (rusty-bidding-bot reads it;
# bridge-common-conventions#133). When an opponent announces one of these
# names for a call, the engine switches the fields on in that side's card
# for the request, so the call and the rest of their auction are read by
# the module for it. A name no entry knows is not guessed at: the engine
# falls back to reading the text's lengths, HCP and flags.
#
# An entry:
#
#   names   the names and spellings, matched as the start of the announced
#           text, ignoring case, punctuation, spacing and CamelCase
#           ("MultiLandy" is "Multi-Landy"); suit symbols are letters
#           (2♦ = 2D) and "notrump", "NT" and "N" after a level are one.
#           The longest name that matches wins.
#   set     card fields, each `address` (a yes/no field, switched on) or
#           `address=value` (a choice, a number, a convention that fills a
#           function: `defence_to_1nt.strong=competitive_bidding/dont`).
#   call    optional: the call(s) the name applies to (`2D`, `2NT`, `X`).
#   after   optional: the auction before the call, as a rule file's `after`
#           line reads it from the announcing side (opponents in
#           parentheses, `|` between alternatives, pattern letters such as
#           `x` and `M`; no named auctions).
#
# An entry with `call` or `after` applies only there, and outranks an entry
# without them for the same name: the same name may mean different things
# in different places ("Multi": a 2♦ opening, or Multi-Landy over 1NT).
#
# Seeded (2026-11-19) from the definitions' own names (conventions/) and
# Brill's convention files (brill-data's name-map.toml, translated to these
# addresses). Names with no card field are left out; see the end of the
# file.

