set = ["competitive_bidding/michaels", "competitive_bidding/michaels:over_major"]

# ── Left out: names with no card field (2026-11-19) ───────────────────
# Brill convention files (brill-data name-map.toml) with nothing to set:
# 1MaXTransferSupport (transfer raises after 1M-(X)), 4SPunt, BRLWeak1C,
# DefensiveGambling, FitBid, GF1N, JumpCuebidGFRaise, MiniMichaels,
# Minor4N and Minor4NSixSix (a 4NT opening for the minors: our 4NT
# opening is an ace ask), NonJumpFit, Overcall1HSplinter,
# OvercallRaise2N, Strong2D, Takeout4NOver4S, ThreeNTGoodMajor, Weak2C,
# FittedNTRaise (Brill's fitted 3NT is not our 3NT raise),
# MajorWithLongerMinor and ThirdSeatFiveCardWeakTwo (styles), and
# MinorRelay2S (one of the minor-transfer styles, which one unknown).
# The Defence files (BergenDefence, ...) are how Brill defends against a
# convention, not a name an opponent announces. Carding (defense/) is not
# here: it does not change how an auction is read. Weak twos are not here
# either: every card plays them unless it says otherwise.
