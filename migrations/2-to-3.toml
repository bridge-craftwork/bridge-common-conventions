switches = { "notrump.lebensohl.play" = "over_1nt_interference", "competitive.lebensohl_weak_twos.play" = "after_weak_two_double" }

[[place]]
convention = "competitive_bidding/rubensohl"
switches = { "notrump.rubensohl.play" = "over_1nt_interference", "competitive.rubensohl_after_double.play" = "after_double" }

[[place]]
convention = "competitive_bidding/unusual_notrump"
switches = { "competitive.unusual_2nt.play" = "at_2nt", "competitive.unusual_1nt.play" = "at_1nt", "competitive.unusual_3nt.play" = "at_3nt", "competitive.unusual_4nt.play" = "at_4nt" }

[[place]]
convention = "bidding_conventions/strong_jump_shifts"
switches = { "general.jump_shifts.strong_2" = "two_level", "general.jump_shifts.strong_3" = "three_level" }

[[place]]
convention = "bidding_conventions/weak_jump_shifts"
switches = { "general.jump_shifts.weak_2" = "two_level", "general.jump_shifts.weak_3" = "three_level" }

# Phase 6 (#91): a convention with a second line of its own for another
# auction is played in two places; its old switch is the first.
[[place]]
convention = "bidding_conventions/new_minor_forcing"
switches = { "other_conventions.new_minor_forcing.play" = "after_1nt_rebid", "other_conventions.new_minor_forcing.after_2nt_rebid" = "after_2nt_rebid" }

[[place]]
convention = "bidding_conventions/texas"
switches = { "notrump.texas.play" = "over_1nt", "notrump.texas.over_2nt" = "over_2nt" }

[[place]]
convention = "bidding_conventions/minor_suit_stayman"
switches = { "notrump.minor_suit_stayman.play" = "over_1nt", "notrump.minor_suit_stayman.over_2nt" = "over_2nt" }

[[place]]
convention = "bidding_conventions/minor_suit_transfers"
switches = { "notrump.minor_transfers.play" = "over_1nt", "notrump.minor_transfers.two_s_clubs" = "two_s_clubs", "notrump.minor_transfers.over_2nt" = "over_2nt" }

# Phase 6: boxes that had no convention of their own.
[[place]]
convention = "bidding_conventions/dopi_ropi"
switches = { "slam.dopi" = "dopi", "slam.ropi" = "ropi" }

[[place]]
convention = "defense/upside_down_signals"
switches = { "carding.suits.upside_down_attitude" = "attitude_suits", "carding.suits.upside_down_count" = "count_suits", "carding.nt.upside_down_attitude" = "attitude_nt", "carding.nt.upside_down_count" = "count_nt", "carding.first_discard.upside_down" = "first_discard", "carding.inverted_count" = "count" }

# Puppet Stayman's two boxes sat under Stayman, and a card that showed
# either was read as playing Stayman.
[[place]]
convention = "bidding_conventions/puppet_stayman"
switches = { "notrump.stayman.puppet_1nt" = "over_1nt", "notrump.stayman.puppet_2nt" = "over_2nt" }
also_plays = "bidding_conventions/stayman"

# A box that stood for more than it said. Where `treatment` is on, each of
# `means` the card is silent on is on too. Reverse Flannery's 2♦ box was the
# only one an editor offered, and a card that ticked it plays both jumps
# over one of a minor (Rick Wilson, 2026-11-14).
[[stood_for]]
treatment = "bidding_conventions/reverse_flannery:two_d"
means = ["bidding_conventions/reverse_flannery:two_h", "bidding_conventions/reverse_flannery:two_s"]

# A convention that gives way: where both are played and `to` fills a part
# of the function, `convention`'s entry is written `for` the parts that are
# left (none, for a function without parts). The rules already read it so.
[[yields]]
function = "major_ask_over_notrump"
convention = "bidding_conventions/stayman"
to = "bidding_conventions/puppet_stayman"

# New Minor Forcing after a 1NT rebid gives way to XYZ and to two-way NMF,
# as the rules already read it; after a 2NT rebid it stays.
[[yields]]
function = "checkback_after_1nt_rebid"
convention = "bidding_conventions/new_minor_forcing"
to = "bidding_conventions/xyz"

[[yields]]
function = "checkback_after_1nt_rebid"
convention = "bidding_conventions/new_minor_forcing"
to = "bidding_conventions/two_way_nmf"

[[yields]]
function = "two_nt_response_to_major"
convention = "bidding_conventions/jacoby_2nt"
to = "bidding_conventions/modified_jacoby_2nt"

[[function]]
function = "defence_to_1nt"
settings = { strong = "competitive.vs_1nt_strong.system", weak = "competitive.vs_1nt_weak.system" }
options = { cappelletti = "competitive_bidding/cappelletti", modified_cappelletti = "competitive_bidding/modified_cappelletti", landy = "competitive_bidding/landy", multi_landy = "competitive_bidding/multi_landy", dont = "competitive_bidding/dont", meckwell = "competitive_bidding/meckwell", suction = "competitive_bidding/suction" }
no_entry = ["natural", "other"]
unless_chosen = { "competitive.dont.play" = "strong" }

[[function]]
function = "opening"
settings = { 2d = "two_level.two_diamonds.meaning", 2h = "two_level.two_hearts.meaning", 2s = "two_level.two_spades.meaning" }
options = { weak = "bidding_conventions/weak_2s", intermediate = "bidding_conventions/intermediate_twos", strong = "bidding_conventions/strong_twos" }
no_entry = ["conventional"]

