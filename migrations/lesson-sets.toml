# The lesson sets that left the pack (docs/CONTRACT.md, sections 3 and 11).
#
# A lesson set is a collection's, not a convention: "Stayman & Transfers
# (Partnership)" is a set of lessons, and Stayman and Jacoby transfers are
# what it teaches. These 20 IDs came in with the lesson taxonomy and were
# defined here until 2026-11-16. Each is recorded with where it went and
# what it covers, so a tag or a note that still names one can be read.
#
# The collection that holds the lessons now says what each covers (its own
# manifest). Nothing here is ever edited or removed; an ID below is never
# given to something else.
#
# [left]  "ID" = { name, to, lesson, covers }
#         `to`: the collection that holds it. `lesson`: its name there.
#         `covers`: the conventions, natural methods and skills it teaches,
#         as IDs this pack defines.

