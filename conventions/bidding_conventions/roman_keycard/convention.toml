id = "bidding_conventions/roman_keycard"
name = "Roman Keycard"
label = "Roman Keycard Blackwood"
source = "taxonomy"
level = 4
contexts = ["slam"]
implements = ["ace_ask"]
names = ["RKCB", "Roman Keycard", "Roman Key Card Blackwood", "Keycard", "1430", "0314"]
confirm_names = ["0314", "1430"]
summary = """
4NT asks for five keycards, the four aces and the trump king. 1430 answers
5♣ one or four, 5♦ three or none, 5♥ two without the trump queen, 5♠ two
with it; 0314 swaps 5♣ and 5♦. The next step asks for the trump queen.
5NT then confirms every keycard and the trump queen and asks for side
kings, by number or, with specific kings, the cheapest one held.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 9 },
  { title = "Slam Bidding: 1430 Keycard Blackwood", by = "Robert S. Todd", site = "Adventures in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/403" },
]

[treatments.style]
kind = "enum"
label = "RKCB responses"
desc = "1430: the first step shows one or four keycards, the second none or three. 0314: the first step none or three, the second one or four"
options = ["1430", "0314"]
level = 4

[treatments.minor_0314]
kind = "bool"
label = "RKCB 0314 with a minor as trumps (1430 in the majors)"
level = 6

[treatments.queen_ask]
kind = "bool"
label = "Queen ask"
level = 6

[treatments.king_ask_specific]
kind = "bool"
label = "King ask: specific kings"
desc = "The king ask is answered by the cheapest side king below six of trumps (six of trumps with none) instead of the number of kings. A new suit below trumps then asks for that king: seven of trumps with it, six of a higher suit below trumps with that king instead, six of trumps with neither. The asker places the grand"
level = 7
