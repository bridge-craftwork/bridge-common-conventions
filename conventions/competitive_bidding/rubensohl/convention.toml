id = "competitive_bidding/rubensohl"
name = "Rubensohl"
source = "proposed"
level = 9
contexts = ["after_interference"]
names = ["Rubensohl", "Transfer Lebensohl"]
summary = """
A transfer version of Lebensohl: after they overcall partner's 1NT,
responder's bids from 2NT up are transfers to the next suit, which lets
responder show a suit, a stopper or values at a lower level.
"""
see = [
  { title = "Transfer Lebensohl", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/transfer-lebensohl" },
  { title = "NT Bidding: Modern, Transfer, and Modern Transfer Lebensohl", by = "Robert S. Todd", site = "Adventures in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/548" },
  { title = "Rubinsohl", site = "Wikipedia", url = "https://en.wikipedia.org/wiki/Rubinsohl" },
]

[treatments.over_1nt_interference]
kind = "bool"
label = "Rubensohl over interference to 1NT"
default = true
level = 9
implements = ["responses_after_1nt_is_overcalled"]

[treatments.after_double]
kind = "bool"
label = "Rubensohl after doubling a weak two"
level = 9
