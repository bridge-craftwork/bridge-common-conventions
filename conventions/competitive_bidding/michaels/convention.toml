id = "competitive_bidding/michaels"
name = "Michaels cue bid"
brief = "Cue = two-suited overcall"
label = "Michaels cuebid"
source = "proposed"
level = 4
contexts = ["overcalls"]
names = ["Michaels", "Michaels cue bid", "Michaels cuebid"]
summary = """
A cue bid of their suit as a two-suited overcall: five-five in two other
suits. Over a minor, the majors; over a major, the other major and a minor.
"""
see = [
  { title = "Michaels Cuebid", site = "Bridge Bum", url = "https://www.bridgebum.com/michaels_cuebid.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 17 },
  { title = "Competitive Bidding: Michaels Cuebid", by = "Robert S. Todd", site = "Adventures in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/480" },
  { title = "Michaels Cue Bid", by = "Larry Cohen", site = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/michaels-cue-bid" },
  { title = "Michaels cuebid", site = "Wikipedia", url = "https://en.wikipedia.org/wiki/Michaels_cuebid" },
]

[treatments.strength]
kind = "enum"
label = "Michaels strength"
desc = "wide_range: any strength from about 7 HCP with five-five (BBA: 8+ total points, 12+ vulnerable). weak_or_strong (mini-maxi): weak, or 16+ and bids again; an intermediate hand overcalls instead. Bridge-Classroom's seed card writes weak_or_strong"
options = ["wide_range", "weak_or_strong"]
default = "wide_range"
skill = false

[treatments.minor_advance]
kind = "enum"
label = "Advancing Michaels over a major: which minor"
desc = "After a Michaels cue bid of a major (the other major and a minor). ask_2nt: advancer bids 2NT to ask for the minor, at any strength; 3♣ and 3♦ are natural, a long suit of advancer's own (Bridge Bum). pass_or_correct: 3♣ is pass or correct to partner's minor, and 2NT a stronger ask (Larry Cohen)"
options = ["ask_2nt", "pass_or_correct"]
default = "ask_2nt"
level = 5

[treatments.over_minor]
kind = "bool"
label = "Cue of a natural 1♣/1♦: Michaels (both majors)"
level = 4

[treatments.over_major]
kind = "bool"
label = "Cue of 1♥/1♠: Michaels (the other major and a minor)"
level = 4

[treatments.over_short_minor]
kind = "bool"
label = "Cue of a possibly short 1♣/1♦: Michaels"
level = 4

[treatments.over_artificial_minor]
kind = "bool"
label = "Cue of an artificial 1♣/1♦: Michaels"
level = 4
