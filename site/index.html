<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bridge-common-conventions</title>
<meta name="description" content="Every convention and treatment the pack defines, and what each has: bidding rules, tests, notes, references, a function it fills.">
<link rel="alternate" type="application/json" href="pack.json" title="The pack (JSON)">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6878; --line: #dde2ea;
  --accent: #1f5fbf; --chip: #eef1f6; --hit: #fff4c2; --hit-line: #e0b400;
  --rules: #1f7a3f; --tests: #2a6fb8; --notes: #8a5a00; --refs: #6b46a8; --fn: #b03a5b; --card: #2f6f73; --off: #c9d0da;
}
:root:not([data-theme="light"]) { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --panel: #1a202a; --ink: #e6eaf0; --muted: #98a3b3; --line: #2c3542;
    --accent: #7fb0ff; --chip: #242c38; --hit: #4a3f10; --hit-line: #d1a800;
    --rules: #5fc983; --tests: #7db4f0; --notes: #e0ae4d; --refs: #b79cf0; --fn: #f08aa6; --card: #6fc3c8; --off: #3a4452;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
header.top { padding: 18px 16px 10px; max-width: 1200px; margin: 0 auto; }
header.top h1 { margin: 0; font-size: 22px; }
header.top h1 .sub { color: var(--muted); font-weight: 400; }
header.top p { margin: 4px 0 8px; color: var(--muted); }
header.top nav a { margin-right: 14px; font-size: 14px; }
main { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.summary div b { font-size: 20px; margin-right: 5px; }
.summary .built { flex-basis: 100%; color: var(--muted); font-size: 13px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.tools label { font-size: 14px; color: var(--muted); }
.tools input[type=search], .tools select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.tools input[type=search] { width: 220px; max-width: 60vw; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.legend li { cursor: pointer; user-select: none; padding: 1px 6px; border-radius: 10px; border: 1px solid transparent; }
.legend li.on { border-color: var(--line); background: var(--chip); color: var(--ink); }
.mark { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; margin-right: 3px; padding: 0 3px; }
.mark.r { background: var(--rules); } .mark.t { background: var(--tests); } .mark.n { background: var(--notes); }
.mark.s { background: var(--refs); } .mark.f { background: var(--fn); } .mark.c { background: var(--card); }
.mark.d { background: var(--muted); }
.mark.off { background: transparent; color: var(--off); border: 1px solid var(--off); font-weight: 400; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark:not(.off) { color: #10141a; } }
h2.cat { font-size: 16px; margin: 22px 0 4px; display: flex; align-items: baseline; gap: 10px; }
h2.cat small { color: var(--muted); font-weight: 400; font-size: 13px; }
.rows { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.row { display: grid; grid-template-columns: 34px minmax(150px, 250px) 150px 1fr; gap: 4px 10px; align-items: start; padding: 5px 10px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--chip); }
.row.recent { background: var(--hit); box-shadow: inset 3px 0 0 var(--hit-line); }
.lvl { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; text-align: center; padding: 0 4px; height: 20px; line-height: 18px; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.marks { white-space: nowrap; }
.treats { display: flex; flex-wrap: wrap; gap: 3px 5px; font-size: 12px; }
.chip { background: var(--chip); border-radius: 4px; padding: 0 6px; color: var(--ink); white-space: nowrap; }
.chip.recent { outline: 2px solid var(--hit-line); }
.chip.fn { color: var(--fn); }
.none { color: var(--muted); font-size: 12px; }
@media (max-width: 760px) {
  .row { grid-template-columns: 34px 1fr; }
  .row .marks, .row .treats { grid-column: 2; }
}
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: min(760px, 94vw); width: 760px; padding: 0; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.dhead { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 14px 16px 6px; }
.dhead h2 { margin: 0; font-size: 19px; }
.dhead button { font: inherit; font-size: 20px; line-height: 1; border: 0; background: none; color: var(--muted); cursor: pointer; }
#dbody { padding: 0 16px 16px; }
#dbody h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 4px; }
#dbody code { background: var(--chip); border-radius: 4px; padding: 0 4px; font-size: 13px; }
#dbody ul { margin: 0; padding-left: 18px; }
#dbody table { border-collapse: collapse; width: 100%; font-size: 14px; }
#dbody td { border-top: 1px solid var(--line); padding: 3px 6px 3px 0; vertical-align: top; }
#dbody td.k { white-space: nowrap; }
.err { color: var(--fn); }
</style>
</head>
<body>
<header class="top">
  <h1>bridge-common-conventions <span class="sub">what is defined</span></h1>
  <p>Every convention and treatment in the published pack, and what each has behind it.</p>
  <nav>
    <a href="pack.json">pack.json</a>
    <a href="manifest.json">manifest.json</a>
    <a href="https://github.com/bridge-craftwork/bridge-common-conventions">Source</a>
    <a href="https://github.com/bridge-craftwork/bridge-common-conventions/blob/main/docs/CONTRACT.md">Contract</a>
  </nav>
</header>

<noscript><p style="max-width:1200px;margin:0 auto;padding:0 16px">This page draws its list with JavaScript. The same data is <a href="pack.json">pack.json</a>.</p></noscript>

<main>
  <section class="panel summary" id="summary" aria-label="Summary">Loading the pack…</section>

  <section class="panel" aria-label="Filters and legend">
    <div class="tools">
      <label>Search <input id="q" type="search" placeholder="Drury, 1NT, Lebensohl…" autocomplete="off" spellcheck="false"></label>
      <label>Show
        <select id="kind">
          <option value="">everything</option>
          <option value="card">what a card can hold</option>
          <option value="skill">skills only (no card entry)</option>
        </select>
      </label>
      <label>Category <select id="cat"><option value="">every category</option></select></label>
      <label><input type="checkbox" id="recent"> Highlight changes in the last</label>
      <label><select id="days"><option>7</option><option selected>30</option><option>90</option></select> days</label>
      <label><input type="checkbox" id="only-recent"> show only those</label>
    </div>
    <ul class="legend" id="legend" aria-label="Legend: click one to show only conventions that have it"></ul>
  </section>

  <div id="grid"></div>
</main>

<dialog id="detail" aria-labelledby="dtitle">
  <div class="dhead"><h2 id="dtitle"></h2><button id="dclose" aria-label="Close">×</button></div>
  <div id="dbody"></div>
</dialog>

<script type="module">
const REPO = 'https://github.com/bridge-craftwork/bridge-common-conventions'
const MARKS = [
  ['r', 'R', 'Bidding rules', c => c.rules.length],
  ['t', 'T', 'Rule tests', c => c.tests],
  ['n', 'N', 'Notes', c => c.notes.length],
  ['s', 'S', 'Sources cited', c => c.refs],
  ['f', 'F', 'Fills a function', c => c.functions.length],
  ['c', 'C', 'A card can hold it', c => (c.card ? 1 : 0)],
  ['d', 'D', 'Deals or a dealer script', c => c.deals],
]
const $ = id => document.getElementById(id)
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v
    else if (k === 'text') e.textContent = v
    else e.setAttribute(k, v)
  }
  for (const k of kids) e.append(k)
  return e
}
const list = v => (v === undefined || v === null ? [] : Array.isArray(v) ? v : [v])

let model = null
const state = { q: '', kind: '', cat: '', recent: false, onlyRecent: false, days: 30, has: new Set() }

async function load() {
  const [pack, manifest] = await Promise.all(['pack.json', 'manifest.json'].map(async f => {
    const r = await fetch(f)
    if (!r.ok) throw new Error(`${f}: ${r.status}`)
    return r.json()
  }))
  return build(pack, manifest)
}

function build(pack, manifest) {
  const files = pack.files || {}
  const changed = Object.fromEntries(Object.entries(manifest.files || {}).map(([p, f]) => [p, f.changed ? Date.parse(f.changed) : 0]))
  // Which rule modules name each ID in their header (skill, convention, or a param that reads it).
  const named = new Map()
  for (const [path, text] of Object.entries(files)) {
    if (!path.endsWith('.bid')) continue
    const ids = new Set()
    for (const m of text.matchAll(/^\s+(?:skill|convention)\s+([a-z_]+\/[a-z0-9_]+)/gm)) ids.add(m[1])
    for (const m of text.matchAll(/^\s+(?:param|card)\s+.*?([a-z_]+\/[a-z0-9_]+)(?::[a-z0-9_]+)?/gm)) ids.add(m[1])
    for (const id of ids) named.set(id, [...(named.get(id) || []), path])
  }
  const cases = text => (text.match(/^[NESW] .*\|/gm) || []).length
  const conventions = Object.values(pack.conventions).map(d => {
    const [cat, short] = d.id.split('/')
    const dir = `conventions/${cat}/${short}/`
    const own = Object.keys(files).filter(p => p.startsWith(dir))
    const rules = [...new Set([...own.filter(p => p.endsWith('.bid')), ...(named.get(d.id) || [])])]
    const tests = own.filter(p => p.endsWith('.test'))
    const ruleTests = rules.map(p => p.replace(/\.bid$/, '.test')).filter(p => files[p])
    const allTests = [...new Set([...tests, ...ruleTests])]
    const treatments = Object.entries(d.treatments || {}).map(([name, a]) => ({ name, ...a }))
    const functions = [...new Set([...list(d.implements), ...treatments.flatMap(t => list(t.implements))])]
    const paths = [`${dir}convention.toml`, ...own]
    return {
      id: d.id, cat, short, def: d, name: d.name, level: d.level ?? null,
      card: list(d.contexts).length > 0, contexts: list(d.contexts),
      rules, tests: allTests.reduce((n, p) => n + cases(files[p]), 0), testFiles: allTests,
      notes: own.filter(p => p.endsWith('.notes.md')),
      refs: list(d.see).length, deals: list(d.deals).length + (d.dealer ? 1 : 0),
      functions, treatments,
      changed: Math.max(0, ...paths.map(p => changed[p] || 0)),
      search: [d.id, d.name, ...list(d.names), ...treatments.map(t => `${t.name} ${t.label || ''}`)].join(' ').toLowerCase(),
    }
  })
  const allCases = Object.entries(files).filter(([p]) => p.endsWith('.test')).reduce((n, [, text]) => n + cases(text), 0)
  return { pack, manifest, conventions, categories: pack.categories || {}, files, allCases }
}

function matches(c) {
  if (state.q && !c.search.includes(state.q)) return false
  if (state.kind === 'card' && !c.card) return false
  if (state.kind === 'skill' && c.card) return false
  if (state.cat && c.cat !== state.cat) return false
  for (const key of state.has) {
    const m = MARKS.find(x => x[0] === key)
    if (!m[3](c)) return false
  }
  if (state.onlyRecent && !isRecent(c)) return false
  return true
}
const cutoff = () => Date.now() - state.days * 864e5
const isRecent = c => c.changed >= cutoff()

function catName(cat) {
  const c = model.categories[cat]
  return (c && (c.name || c.label)) || cat.replace(/_/g, ' ').replace(/^./, s => s.toUpperCase())
}

function draw() {
  const { conventions, manifest } = model
  const shown = conventions.filter(matches)
  const count = (f, of = conventions) => of.filter(f).length
  const sum = $('summary')
  sum.replaceChildren(
    el('div', {}, el('b', { text: conventions.length }), 'definitions'),
    el('div', {}, el('b', { text: count(c => c.card) }), 'a card can hold'),
    el('div', {}, el('b', { text: conventions.reduce((n, c) => n + c.treatments.length, 0) }), 'treatments'),
    el('div', {}, el('b', { text: count(c => c.rules.length) }), 'with bidding rules'),
    el('div', {}, el('b', { text: model.allCases }), 'rule test cases'),
    el('div', {}, el('b', { text: Object.keys(model.pack.functions || {}).length }), 'functions'),
    el('div', { class: 'built' },
      `Rules number ${manifest.rules_number}, built from `,
      el('a', { href: `${REPO}/commit/${manifest.source_commit}`, text: String(manifest.source_commit).slice(0, 10) }),
      manifest.checked_with ? `, checked with ${manifest.checked_with}` : '',
      `. Showing ${shown.length} of ${conventions.length}.`),
  )

  const legend = $('legend')
  legend.replaceChildren(...MARKS.map(([key, letter, label, has]) => {
    const li = el('li', { class: state.has.has(key) ? 'on' : '', title: 'Show only conventions that have this' },
      el('span', { class: `mark ${key}`, text: letter }), `${label} (${count(c => has(c))})`)
    li.onclick = () => { state.has.has(key) ? state.has.delete(key) : state.has.add(key); draw() }
    return li
  }))

  const grid = $('grid')
  grid.replaceChildren()
  const cats = [...new Set(conventions.map(c => c.cat))]
  for (const cat of cats) {
    const rows = shown.filter(c => c.cat === cat).sort((a, b) => (a.level ?? 99) - (b.level ?? 99) || a.name.localeCompare(b.name))
    if (!rows.length) continue
    grid.append(el('h2', { class: 'cat' }, catName(cat), el('small', { text: `${rows.length} shown` })))
    const box = el('div', { class: 'rows' })
    for (const c of rows) box.append(row(c))
    grid.append(box)
  }
  if (!shown.length) grid.append(el('p', { class: 'none', text: 'Nothing matches.' }))
}

function row(c) {
  const recent = state.recent && isRecent(c)
  const marks = el('div', { class: 'marks' }, ...MARKS.map(([key, letter, label, has]) => {
    const n = has(c)
    return el('span', { class: `mark ${key}${n ? '' : ' off'}`, title: n ? `${label}${n > 1 ? `: ${n}` : ''}` : `No ${label.toLowerCase()}`, text: letter })
  }))
  const treats = el('div', { class: 'treats' })
  for (const f of c.functions) treats.append(el('span', { class: 'chip fn', title: 'Fills this function', text: `→ ${f}` }))
  for (const t of c.treatments) treats.append(el('span', { class: 'chip', title: t.label || t.name, text: t.name }))
  if (!c.functions.length && !c.treatments.length) treats.append(el('span', { class: 'none', text: c.card ? 'no treatments' : '' }))
  const r = el('div', { class: `row${recent ? ' recent' : ''}`, tabindex: '0', role: 'button' },
    el('span', { class: 'lvl', title: 'Level, 1 to 10', text: c.level ?? '–' }),
    el('div', { class: 'name' }, c.name, el('small', { text: c.short + (recent ? ` · changed ${new Date(c.changed).toISOString().slice(0, 10)}` : '') })),
    marks, treats)
  r.onclick = () => detail(c)
  r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); detail(c) } }
  return r
}

function detail(c) {
  const d = c.def
  const commit = model.manifest.source_commit
  const link = p => el('a', { href: `${REPO}/blob/${commit}/${p}`, text: p })
  const body = $('dbody')
  $('dtitle').textContent = c.name
  body.replaceChildren(
    el('p', {}, el('code', { text: c.id }), c.level != null ? `  ·  level ${c.level}` : '', c.changed ? `  ·  last changed ${new Date(c.changed).toISOString().slice(0, 10)}` : ''),
    el('p', { text: (d.summary || '').trim() || 'No summary yet.' }),
  )
  const section = (title, ...kids) => { if (kids.length) body.append(el('h3', { text: title }), ...kids) }
  if (list(d.names).length) section('Also called', el('p', { text: list(d.names).join(', ') }))
  if (c.contexts.length || c.functions.length) {
    section('Where it applies', el('p', {},
      c.contexts.length ? `Context: ${c.contexts.join(', ')}. ` : 'Not held on a card. ',
      c.functions.length ? `Fills: ${c.functions.join(', ')}.` : ''))
  }
  if (c.treatments.length) {
    const t = el('table')
    for (const x of c.treatments) {
      t.append(el('tr', {},
        el('td', { class: 'k' }, el('code', { text: x.name })),
        el('td', { text: [x.label, x.kind === 'enum' ? `(${list(x.options).join(', ')})` : x.kind !== 'bool' ? `(${x.kind})` : '',
          x.default !== undefined ? `default ${x.default}` : '', list(x.implements).length ? `fills ${list(x.implements).join(', ')}` : ''].filter(Boolean).join(' ') }),
        el('td', { class: 'k', text: x.level != null ? `level ${x.level}` : '' })))
    }
    section('Treatments', t)
  }
  const filesOf = (title, paths) => { if (paths.length) section(title, el('ul', {}, ...paths.map(p => el('li', {}, link(p))))) }
  filesOf('Bidding rules', c.rules)
  filesOf(`Tests (${c.tests} cases)`, c.testFiles)
  filesOf('Notes', c.notes)
  if (list(d.see).length) {
    section('Sources', el('ul', {}, ...list(d.see).map(s => el('li', {},
      s.url ? el('a', { href: s.url, text: s.title || s.url, rel: 'noopener' }) : (s.title || ''),
      [s.by && ` by ${s.by}`, s.site && `, ${s.site}`, s.kind === 'book' && s.chapter && `, chapter ${s.chapter}`].filter(Boolean).join('')))))
  }
  section('Definition', el('p', {}, link(`conventions/${c.cat}/${c.short}/convention.toml`)))
  $('detail').showModal()
}

function wire() {
  const cat = $('cat')
  for (const c of [...new Set(model.conventions.map(c => c.cat))]) cat.append(el('option', { value: c, text: catName(c) }))
  $('q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); draw() }
  $('kind').onchange = e => { state.kind = e.target.value; draw() }
  cat.onchange = e => { state.cat = e.target.value; draw() }
  $('recent').onchange = e => { state.recent = e.target.checked; draw() }
  $('only-recent').onchange = e => { state.onlyRecent = e.target.checked; if (e.target.checked) { state.recent = true; $('recent').checked = true } draw() }
  $('days').onchange = e => { state.days = Number(e.target.value); draw() }
  $('dclose').onclick = () => $('detail').close()
  $('detail').onclick = e => { if (e.target === $('detail')) $('detail').close() }
}

try {
  model = await load()
  wire()
  draw()
} catch (err) {
  $('summary').replaceChildren(el('span', { class: 'err', text: `Could not load the pack (${err.message}). This page reads pack.json and manifest.json from beside it.` }))
}
</script>
</body>
</html>
