# The jobs that one convention at a time can do (docs/CONTRACT.md, section 6).
# A convention says which it fills with `implements`; two conventions a card
# plays for the same part are in conflict.

[defence_to_1nt]
name = "Defence to their 1NT opening"
parts = ["strong", "weak"]
# A stored setting of `other` names no convention: whichever the card plays
# for the part fills it.
defers = ["other"]

# What `competitive.vs_1nt_strong.system` held in card schema 2: its label, and the
# words other tools write for each choice. `natural` and `other` name no
# convention, so a card that held them has no entry for this part.
[defence_to_1nt.was.strong]
setting = "competitive.vs_1nt_strong.system"
label = "Defense vs strong 1NT"
options = ["cappelletti", "modified_cappelletti", "landy", "multi_landy", "dont", "meckwell", "suction", "natural", "other"]
value_aliases = { Hamilton = "cappelletti", Pottage = "cappelletti", "Disturbing Opponents NT" = "dont", Penalty = "other", Standard = "other", "Strong - Suction" = "suction", "Weak - Suction" = "suction", "Strong 14+ (Meckwell)" = "meckwell", "Weak (Cappelletti)" = "cappelletti", "Strong 1NT" = "other", "Weak 1NT" = "other", Strong = "other", Weak = "other", "(Strong)" = "other", "(Weak)" = "other", "Strong/Weak" = "other" }
desc = "Bridge-Classroom's system name (its editor's list: Cappelletti, DONT, Meckwell, Multi-Landy, Penalty...). Unset, natural or other: natural overcalls. cappelletti (Hamilton): X penalty, 2♣ one suit, 2♦ majors, 2♥/2♠ that major and a minor, 2NT minors. modified_cappelletti: 2♣ a minor one-suiter or a major and a minor, 2♥/2♠ one-suited. dont: X one suit, 2♣/2♦/2♥ that suit and a higher one, 2♠ spades. meckwell: X a minor or the majors, 2♣/2♦ that minor and a major, 2♥/2♠ natural, 2NT minors. multi_landy: X a four-card major and a longer minor, 2♣ majors, 2♦ one major, 2♥/2♠ that major and a minor. landy: 2♣ majors, the rest natural. Played against every 1NT range. See conventions/competitive/vs-1nt.notes.md"
level = 5
skill = ["competitive_bidding/defense_vs_1nt", "competitive_bidding/cappelletti", "competitive_bidding/modified_cappelletti", "competitive_bidding/dont", "competitive_bidding/meckwell", "competitive_bidding/landy", "competitive_bidding/multi_landy", "competitive_bidding/suction"]

# What `competitive.vs_1nt_weak.system` held in card schema 2: its label, and the
# words other tools write for each choice. `natural` and `other` name no
# convention, so a card that held them has no entry for this part.
[defence_to_1nt.was.weak]
setting = "competitive.vs_1nt_weak.system"
label = "Defense vs weak 1NT"
options = ["cappelletti", "modified_cappelletti", "landy", "multi_landy", "dont", "meckwell", "suction", "natural", "other"]
value_aliases = { Hamilton = "cappelletti", Pottage = "cappelletti", "Disturbing Opponents NT" = "dont", Penalty = "other", Standard = "other", "Strong - Suction" = "suction", "Weak - Suction" = "suction", "Strong 14+ (Meckwell)" = "meckwell", "Weak (Cappelletti)" = "cappelletti", "Strong 1NT" = "other", "Weak 1NT" = "other", Strong = "other", Weak = "other", "(Strong)" = "other", "(Weak)" = "other", "Strong/Weak" = "other" }
desc = "Not read by the rules yet: vs_1nt_strong.system is played against every range"
level = 5
skill = ["competitive_bidding/defense_vs_1nt", "competitive_bidding/cappelletti", "competitive_bidding/modified_cappelletti", "competitive_bidding/dont", "competitive_bidding/meckwell", "competitive_bidding/landy", "competitive_bidding/multi_landy", "competitive_bidding/suction"]

[defence_to_1nt.option]
cappelletti = "competitive_bidding/cappelletti"
modified_cappelletti = "competitive_bidding/modified_cappelletti"
landy = "competitive_bidding/landy"
multi_landy = "competitive_bidding/multi_landy"
dont = "competitive_bidding/dont"
meckwell = "competitive_bidding/meckwell"
suction = "competitive_bidding/suction"

[ace_ask]
name = "Asking for aces or keycards"
parts = ["major", "minor"]

[michaels_vs_preempts]
name = "Two-suited overcall of their preempt"

[opening]
name = "Meaning of a two-level opening bid"
parts = ["2c", "2d", "2h", "2s"]
# A stored `meaning` of `conventional` names no convention: whichever the
# card plays for the bid fills the part.
defers = ["conventional"]

# What the three `two_level.two_<suit>.meaning` settings held in card schema
# 2. `weak`, `intermediate` and `strong` each named a kind of two-bid, now a
# convention; `conventional` named none. The 2♣ opening's own setting
# (`two_level.two_clubs.meaning`) stays a setting: Strong 2♣ and Benjamin
# say they fill the part, and nothing on a card changes.
[opening.option]
weak = "bidding_conventions/weak_2s"
intermediate = "bidding_conventions/intermediate_twos"
strong = "bidding_conventions/strong_twos"

[opening.was.2d]
setting = "two_level.two_diamonds.meaning"
label = "2♦ meaning"
options = ["weak", "intermediate", "strong", "conventional"]
skill = "bidding_conventions/weak_2s"
level = 3
plays = { weak = "bidding_conventions/weak_2s" }

[opening.was.2h]
setting = "two_level.two_hearts.meaning"
label = "2♥ meaning"
options = ["weak", "intermediate", "strong", "conventional"]
skill = "bidding_conventions/weak_2s"
level = 3
plays = { weak = "bidding_conventions/weak_2s" }

[opening.was.2s]
setting = "two_level.two_spades.meaning"
label = "2♠ meaning"
options = ["weak", "intermediate", "strong", "conventional"]
skill = "bidding_conventions/weak_2s"
level = 3
plays = { weak = "bidding_conventions/weak_2s" }

# The keycard ask made below 4NT, by the agreed suit: four of the minor
# (Minorwood), or the step above four of the trump suit (Kickback; played
# in the minors only it is Redwood, an entry with `for`). 4NT stays the ask
# of the convention that fills `ace_ask`, when the cheaper bid has gone by.
[low_keycard_ask]
name = "The keycard ask below 4NT"
parts = ["clubs", "diamonds", "hearts"]

# Responder's jump to two of a major over partner's 1♣ or 1♦. Reverse
# Flannery claims both (its `two_h` and `two_s` treatments say which a card
# plays), and so do weak and strong jump shifts. A card's jump-shift style
# is still the `general.jump_shifts.*` settings, so today only Reverse
# Flannery arrives as an entry; the others compete once those boxes become
# entries.
#
# With nothing filling it, the jump is strong with no interference and weak
# in competition (Rick, 2026-11-14). A weak jump with no interference is
# alerted, as Reverse Flannery is (alerts.toml).
[jump_to_major_over_minor]
name = "Responder's jump to two of a major over one of a minor"
parts = ["2h", "2s"]

# Responder's ask for a major over a notrump opening: 2♣ over 1NT, 3♣ over
# 2NT. Stayman fills both. Puppet Stayman fills the 2NT part through its
# `over_2nt` treatment, and Stayman gives that part way to it (the
# migration writes Stayman's entry `for` the 1NT part).
[major_ask_over_notrump]
name = "Responder's ask for a major over a notrump opening"
parts = ["1nt", "2nt"]

# Responder's 2NT over partner's 1♥ or 1♠: Jacoby 2NT, or Modified Jacoby
# 2NT with its own answers.
[two_nt_response_to_major]
name = "Responder's 2NT over one of a major"
